<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="tam in a terminal: a sidebar on the left lists tmux sessions with cards for Claude and Codex agents, their topic, status, branch and linked issues and PRs, next to a Claude Code pane">
  <style>
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d8dee9; white-space: pre; }
    .dim { fill: #6b7385; }
    .b { font-weight: 700; }
    .g { fill: #50fa7b; }
    .y { fill: #f1fa8c; }
    .c { fill: #8be9fd; }
    .p { fill: #ff79c6; }
    .u { text-decoration: underline; }
    .t { font-size: 13px; }
    .k { fill: #16171f; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262836"/>
      <stop offset="1" stop-color="#1c1d27"/>
    </linearGradient>
    <clipPath id="win"><rect x="12" y="10" width="936" height="536" rx="12"/></clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="12" y="10" width="936" height="536" rx="12" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12" y="10" width="936" height="34" rx="12" fill="#2f3142"/>
  <rect x="12" y="32" width="936" height="12" fill="#2f3142"/>
  <circle cx="36" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="27" r="6" fill="#febc2e"/>
  <circle cx="76" cy="27" r="6" fill="#28c840"/>
  <text x="480" y="32" text-anchor="middle" class="dim t">tam:api</text>

  <!-- sidebar pane (left) -->
  <text x="37" y="70">4 total · 1 working · <tspan class="y b">1 waiting</tspan></text>
  <text x="37" y="87" class="dim">Ctrl+r rename · Ctrl+x close</text>
  <text x="20" y="110" class="c">&gt;</text>

  <text x="37" y="134" class="dim">API</text><text x="382" y="134" text-anchor="end">+ terminal</text>

  <!-- the current window: coloured bar and name; also the marked card -->
  <rect x="17" y="154" width="372" height="68" rx="3" fill="#44475a" opacity="0.55"/>
  <text x="20" y="168" class="c">▌</text>
  <text x="37" y="168" class="c">┃</text><text x="45" y="168" class="y b">◆</text><text x="62" y="168" class="c b">Fix flaky upload test</text>
  <text x="37" y="185" class="c">┃</text><text x="62" y="185">claude · ~/code/api</text>
  <text x="37" y="202" class="c">┃</text><text x="62" y="202"><tspan class="y b">waiting for you</tspan><tspan class="dim"> · 3m · upload-retry</tspan></text>
  <text x="37" y="219" class="c">┃</text><text x="62" y="219">Issue: <tspan class="u">#40</tspan>  PR: <tspan class="u">#42</tspan></text>

  <text x="45" y="253" class="dim">○</text><text x="62" y="253" class="b">Rate limit the login endpoint</text>
  <text x="62" y="270">codex · ~/code/api</text>
  <text x="62" y="287" class="dim">idle · 8m · login-rate-limit</text>
  <text x="62" y="304">PR: <tspan class="u">#45</tspan></text>

  <text x="45" y="338" class="dim">›</text><text x="62" y="338" class="b">api</text>
  <text x="62" y="355">uv run pytest -x</text>
  <text x="62" y="372" class="dim">terminal · 2 panes · 12m · main</text>

  <text x="37" y="406" class="dim">WEB</text><text x="382" y="406" text-anchor="end">+ terminal</text>

  <text x="45" y="440" class="g">●</text><text x="62" y="440" class="b">Dark mode for the settings page</text>
  <text x="62" y="457">claude · ~/code/web</text>
  <text x="62" y="474" class="dim">working · 1m · dark-mode</text>
  <text x="62" y="491">Issue: <tspan class="u">#18</tspan></text>

  <line x1="396" y1="44" x2="396" y2="518" stroke="#44475a"/>

  <!-- agent pane (right) -->
  <text x="412" y="78" class="p b">✻</text>
  <text x="430" y="78" class="b">Claude Code</text>
  <text x="538" y="78" class="dim">~/code/api</text>
  <text x="412" y="112" class="dim">&gt;</text>
  <text x="430" y="112">fix the flaky upload test from issue #40</text>
  <text x="412" y="146" class="g">⏺</text>
  <text x="430" y="146">Read tests/test_upload.py</text>
  <text x="412" y="172" class="g">⏺</text>
  <text x="430" y="172">The retry loop never waits between attempts,</text>
  <text x="430" y="192">so the mock server is still starting on the</text>
  <text x="430" y="212">second try.</text>
  <text x="412" y="246" class="g">⏺</text>
  <text x="430" y="246">Update(src/upload.py)</text>
  <text x="430" y="268" class="dim">  42 </text><text x="478" y="268" class="g">+        time.sleep(backoff)</text>
  <text x="430" y="288" class="dim">  43 </text><text x="478" y="288" class="g">+        backoff *= 2</text>
  <text x="412" y="322" class="g">⏺</text>
  <text x="430" y="322">Bash(uv run pytest tests/test_upload.py)</text>
  <text x="430" y="342" class="dim">  ⎿  12 passed in 0.84s</text>
  <text x="412" y="376" class="g">⏺</text>
  <text x="430" y="376">Opened PR #42: Wait between upload retries.</text>
  <text x="430" y="396">Should I also add a test for the backoff?</text>
  <rect x="412" y="420" width="516" height="36" rx="6" fill="none" stroke="#44475a"/>
  <text x="426" y="443" class="dim">&gt;</text>
  <rect x="442" y="430" width="9" height="17" fill="#d8dee9" opacity="0.8"/>

  <!-- tmux status bar -->
  <g clip-path="url(#win)">
    <rect x="12" y="518" width="936" height="28" fill="#50fa7b"/>
  </g>
  <text x="24" y="537" class="k b">[api]</text>
  <text x="80" y="537" class="k">1:claude*  2:codex  3:api</text>
  <text x="936" y="537" class="k" text-anchor="end">14:32</text>
</svg>
