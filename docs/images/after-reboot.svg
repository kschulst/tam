<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="After a reboot, running tam restores the tmux windows; each agent pane waits for Enter to resume its conversation">
  <style>
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d8dee9; white-space: pre; }
    .dim { fill: #6b7385; }
    .b { font-weight: 700; }
    .g { fill: #50fa7b; }
    .c { fill: #8be9fd; }
    .k { fill: #16171f; }
    .t { font-size: 13px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262836"/>
      <stop offset="1" stop-color="#1c1d27"/>
    </linearGradient>
    <clipPath id="win"><rect x="12" y="10" width="936" height="276" rx="12"/></clipPath>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="12" y="10" width="936" height="276" rx="12" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="12" y="10" width="936" height="34" fill="#2f3142"/>
    <rect x="12" y="258" width="936" height="28" fill="#50fa7b"/>
  </g>
  <circle cx="36" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="27" r="6" fill="#febc2e"/>
  <circle cx="76" cy="27" r="6" fill="#28c840"/>
  <text x="480" y="32" text-anchor="middle" class="dim t">after a reboot: tam</text>

  <!-- left pane: claude -->
  <text x="30" y="100"><tspan class="b">claude: resume claude?</tspan>  [Enter] continue  [q] close</text>

  <line x1="480" y1="52" x2="480" y2="150" stroke="#44475a"/>
  <line x1="12" y1="150" x2="948" y2="150" stroke="#44475a"/>

  <!-- right pane: codex -->
  <text x="498" y="100"><tspan class="b">codex: resume codex?</tspan>  [Enter] continue  [q] close</text>

  <text x="30" y="200" class="c">Each agent pane waits. Press Enter and the agent resumes</text>
  <text x="30" y="222" class="c">the same conversation, in the same directory and split.</text>

  <text x="24" y="277" class="k b">[api]</text>
  <text x="80" y="277" class="k">1:api:claude*  2:api:zsh</text>
  <text x="936" y="277" class="k" text-anchor="end">09:02</text>
</svg>
